memory_limit=256M
upload_max_filesize=64M
post_max_size=64M
expose_php=Off

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16

; The image is rebuilt on every deploy, so cached files never change on disk
; underneath a running container - safe to skip the mtime check.
opcache.validate_timestamps=0
